<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#0B0F17" />
    </linearGradient>

    <!-- DNA Helix Gradients -->
    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="100%" stopColor="#0066FF" />
    </linearGradient>
    <linearGradient id="helixGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>
    <linearGradient id="rungGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00E5FF" stopOpacity="0.95" />
      <stop offset="50%" stopColor="#FFFFFF" stopOpacity="1" />
      <stop offset="100%" stopColor="#0088FF" stopOpacity="0.95" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- DNA Ladder Rungs (Connecting Base Pairs) -->
  <g filter="url(#glow)">
    <line x1="20" y1="18" x2="44" y2="18" stroke="url(#rungGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="26" x2="40" y2="26" stroke="url(#rungGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
    <line x1="29" y1="32" x2="35" y2="32" stroke="url(#rungGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="38" x2="40" y2="38" stroke="url(#rungGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
    <line x1="20" y1="46" x2="44" y2="46" stroke="url(#rungGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left Helix Strand -->
    <path
      d="M 20 14 C 13 24, 13 27, 32 32 C 51 37, 51 40, 44 50"
      stroke="url(#helixGrad1)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Right Helix Strand -->
    <path
      d="M 44 14 C 51 24, 51 27, 32 32 C 13 37, 13 40, 20 50"
      stroke="url(#helixGrad2)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Glowing Nodes / Atoms -->
    <circle cx="20" cy="14" r="3.2" fill="#00E5FF" />
    <circle cx="44" cy="14" r="3.2" fill="#38BDF8" />
    <circle cx="20" cy="18" r="2.5" fill="#00E5FF" />
    <circle cx="44" cy="18" r="2.5" fill="#0088FF" />
    <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" />
    <circle cx="20" cy="46" r="2.5" fill="#0088FF" />
    <circle cx="44" cy="46" r="2.5" fill="#00E5FF" />
    <circle cx="20" cy="50" r="3.2" fill="#00E5FF" />
    <circle cx="44" cy="50" r="3.2" fill="#38BDF8" />
  </g>
</svg>
